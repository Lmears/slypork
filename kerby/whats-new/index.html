<body class="text-neutral-900 dark:text-neutral-100">
    <canvas id="boidCanvas"></canvas>
    <div id="controls">
        <button id="godModeButton" class="mr-2 hidden md:block">
            <svg
                class="w-4 h-4 fill-current text-background hover:text-backgroundHovered transition transform hover:scale-110">
                <use href="/assets/images/icons.svg#sliders"></use>
            </svg>
        </button>
        <input type="range" id="speedSlider" min="0" max="200" value="100">
        <span id="speedValue" class="ml-2 text-background text-right w-10">100%</span>
    </div>
    <main id="container" class="flex px-4 pb-12 pt-8 md:px-12 md:pt-12 mx-auto nav-balanced">
        <header class="pinned-nav">
            <nav id="site-nav" class="flex flex-row justify-center sm:flex-col text-2xl group">
                <button id="hamburger-menu" aria-label="Menu" aria-controls="site-nav" aria-expanded="false"
                    class="py-3 px-2 sm:hidden">&#9776;</button>
                <ul id="navLinks"
                    class="inline-flex flex-col sm:flex-row md:flex md:flex-col md:items-start min-h-[60.75px] items-center justify-between min-w-0 md:min-w-36">
                    <li
                        class="group-[.nav-active]:pb-4 sm:group-[.nav-active]:pb-0 md:group-[.nav-active]:pb-9 md:px-3 md:pt-3 md:pb-9">
                        <a href="/" id="homeLink" class="p-1 block">
                            <img src="/assets/images/slypork_logo.svg" alt="Home"
                                class="w-[64px] sm:w-[48px] md:w-[80px] aspect-[80/65.94] home-logo">
                        </a>
                    </li>
                    <li class="hidden group-[.nav-active]:block sm:block p-0 md:p-3">
                        <a href="/about/" id="aboutLink">
                            <span class="nav-link-text">About</span></a>
                    </li>
                    <li class="hidden group-[.nav-active]:block sm:block p-0 md:p-3">
                        <a href="/mastering/" id="masteringLink">
                            <span class="nav-link-text">Mastering</span></a>
                    </li>
                    <li class="hidden group-[.nav-active]:block sm:block p-0 md:p-3">
                        <a href="/music/" id="musicLink">
                            <span class="nav-link-text">Music</span></a>
                    </li>
                    <li class="hidden group-[.nav-active]:block sm:block p-0 md:p-3">
                        <a href="/design/" id="designLink">
                            <span class="nav-link-text">Design</span></a>
                    </li>
                    <li class="hidden group-[.nav-active]:block sm:block p-0 md:p-3">
                        <a href="/software/" id="softwareLink">
                            <span class="nav-link-text">Software</span></a>
                    </li>
                    <li class="hidden group-[.nav-active]:block sm:block p-0 md:p-3">
                        <a href="/contact/" id="contactLink">
                            <span class="nav-link-text">Contact</span></a>
                    </li>
                </ul>
            </nav>
        </header>
        <section id="content" class="kerby-content flex-1 md:px-4 flex flex-col">
            <div class="kerby-header">
                <a class="kerby-brand font-kerby" href="/kerby/" aria-label="KerBy overview">KerBy</a>
                <nav class="kerby-nav" aria-label="KerBy">
                    <div><a href="/kerby/">Overview</a><a href="/kerby/learn/">Learn</a><a href="/kerby/reference/">Reference</a></div>
                </nav>
            </div>
            <div class="visual-container kerby-frame">
                <div class="kerby-page kerby-doc">
                    <header class="kerby-doc-header"><a class="link-underline kerby-back" href="/kerby/">←
                            Overview</a>
                        <p class="kerby-eyebrow">What's new</p>
                        <h1 class="kerby-doc-title">Every version, newest first.</h1>
                        <p class="kerby-lead">Updates are free. There’s no subscription.</p>
                        <p class="kerby-doc-meta"><a href="/kerby/install/#updates" class="link-underline">How
                                updates arrive</a></p>
                    </header>
                    <!-- Filled by kerby.js from /kerby/changelog.html, which scripts/changelog.py
                         in the plugin repo generates from CHANGELOG.md each release. The notes
                         have a page of their own so the Overview stays a sales page; it links here
                         from the version in its hero and from the sign-up form. release.sh checks this
                         container exists, so removing or renaming this page fails a release
                         loudly rather than silently dropping the notes. -->
                    <article class="kerby-changelog">
                        <div id="kerbyChangelog" data-kerby-changelog>
                            <noscript>
                                <p class="text-lg font-light pt-4"><a href="/kerby/changelog.html"
                                        class="link-underline">Read the changelog</a></p>
                            </noscript>
                        </div>
                    </article>
                </div>
            </div>
        </section>
    </main>
    <script src="/assets/js/kerby.js"></script>
    <script src="/assets/js/script.js"></script>
    <script src="/assets/js/boids/simulation.js" type="module"></script>
    <div class="easter-egg" id="easterEgg"></div>
    <script src="/assets/js/boids/easter-egg.js" type="module"></script>
