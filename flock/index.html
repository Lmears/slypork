<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data:; font-src 'self' https://cdnjs.cloudflare.com; connect-src 'self' https://buttondown.com; frame-src https://bandcamp.com https://w.soundcloud.com https://open.spotify.com https://calendar.google.com https://forms.gle https://docs.google.com https://app.accessquest.com https://app.mylifemyvoice.org.nz https://twistedfrequency.nz; base-uri 'none'; object-src 'none'; form-action https://buttondown.com">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width">
    <title>Flock | Slypork</title>
    <link rel="icon" href="../assets/images/slypork_logo.svg" type="image/svg+xml">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32x32.png">
    <link rel="apple-touch-icon" href="../assets/images/favicon-192x192.png">
    <link href="../assets/css/output.css" rel="stylesheet">
</head>

<body data-page-mode="permanent-sim">
    <canvas id="boidCanvas"></canvas>
    <div id="controls">
        <button id="godModeButton" class="mr-2 hidden md:block">
            <svg
                class="w-4 h-4 fill-current text-background hover:text-backgroundHovered transition transform hover:scale-110">
                <use href="../assets/images/icons.svg#sliders"></use>
            </svg>
        </button>
        <input type="range" id="speedSlider" min="0" max="200" value="100">
        <span id="speedValue" class="ml-2 text-background text-right w-10">100%</span>
    </div>
    <main id="container" class="flex px-4 pb-12 pt-8 md:px-12 md:pt-12 mx-auto">
        <section id="content" class="flex-1 flex flex-col">
            <div class="flex flex-col items-center">
                <a href=".." id="homeLink" class="p-1">
                    <img id="simpleHomeLink" src="../assets/images/slypork_logo.svg" alt="Home"
                        class="w-[64px] md:w-[80px] aspect-[80/65.94] home-logo">
                </a>
            </div>
        </section>
    </main>
    <script src="../assets/js/script.js"></script>
    <script src="../assets/js/boids/simulation.js" type="module"></script>
    <script src="../assets/js/flock.js" type="module"></script>
</body>

</html>
