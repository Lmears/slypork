<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data:; font-src 'self' https://cdnjs.cloudflare.com; connect-src 'self' https://buttondown.com; frame-src https://bandcamp.com https://w.soundcloud.com https://open.spotify.com https://calendar.google.com https://forms.gle https://docs.google.com https://app.accessquest.com https://app.mylifemyvoice.org.nz https://twistedfrequency.nz; base-uri 'none'; object-src 'none'; form-action https://buttondown.com">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width">
    <meta name="description"
        content="Slypork: Explore a portfolio of audio plugins, mastering, music, and software. Connect and delve into creative and technical work.">
    <title>Slypork</title>
    <link rel="icon" href="./assets/images/slypork_logo.svg" type="image/svg+xml">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
    <link rel="apple-touch-icon" href="./assets/images/favicon-192x192.png">
    <link rel="preload" href="./assets/fonts/roboto-v48-latin-500.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./assets/fonts/roboto-v48-latin-200.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./assets/models/slypork-pig.glb" as="fetch" crossorigin media="(pointer: fine), (pointer: none)">
    <link rel="preload" href="./assets/models/slypork-pig-low.glb" as="fetch" crossorigin media="(pointer: coarse)">
    <link rel="preload" href="./assets/models/forest.exr" as="fetch" crossorigin>
    <link rel="modulepreload" href="./assets/js/vendor/three-pig.js">
    <link rel="preload" fetchpriority="high" as="image" href="../assets/images/slypork_logo.svg" type="image/svg+xml">
    <link rel="preload" fetchpriority="high" as="image" href="../assets/images/slypork_logo_raised.svg" type="image/svg+xml">
    <link href="./assets/css/output.css" rel="stylesheet">
</head>

<body class="text-neutral-900 dark:text-neutral-100">
    <canvas id="boidCanvas"></canvas>
    <div id="controls">
        <button id="godModeButton" class="mr-2 hidden md:block">
            <svg
                class="w-4 h-4 fill-current text-background hover:text-backgroundHovered transition transform hover:scale-110">
                <use href="./assets/images/icons.svg#sliders"></use>
            </svg>
        </button>
        <input type="range" id="speedSlider" min="0" max="200" value="100">
        <span id="speedValue" class="ml-2 text-background text-right w-10">100%</span>
    </div>
    <main id="container" class="home-page mx-auto">
        <header class="home-header">
            <div id="footer" class="home-wordmark">slypork.net</div>
        </header>

        <section id="content" class="home-hero" aria-label="Slypork">
            <button id="pigStage" class="pig-stage" type="button" aria-label="Show navigation"
                aria-controls="site-nav" aria-expanded="false" disabled>
                <canvas id="pigCanvas" aria-hidden="true"></canvas>
                <span class="pig-hint" aria-hidden="true">Explore <span>↗</span></span>
            </button>

            <nav id="site-nav" class="home-nav" aria-label="Main navigation">
                <ul id="navLinks">
                    <li><a href="./plugins/" id="pluginsLink"><span class="nav-link-text">Plugins</span></a></li>
                    <li><a href="./music/" id="musicLink"><span class="nav-link-text">Music</span></a></li>
                    <li><a href="./mastering/" id="masteringLink"><span class="nav-link-text">Mastering</span></a></li>
                    <li><a href="./software/" id="softwareLink"><span class="nav-link-text">Software</span></a></li>
                    <li><a href="./about/" id="aboutLink"><span class="nav-link-text">About</span></a></li>
                    <li><a href="./contact/" id="contactLink"><span class="nav-link-text">Contact</span></a></li>
                </ul>
            </nav>
        </section>
    </main>
    <script src="./assets/js/script.js"></script>
    <script src="./assets/js/boids/simulation.js" type="module"></script>
    <script src="./assets/js/pig.js" type="module"></script>
    <div class="easter-egg" id="easterEgg"></div>
    <script src="./assets/js/boids/easter-egg.js" type="module"></script>
</body>

</html>
